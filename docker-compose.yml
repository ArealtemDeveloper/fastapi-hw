version: "3.8"

services:
  postgres: 
    container_name: fastapi-postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=my_pass
      - PG_DATA=/data/postgres
    volumes:
      - ./postgres-data:/data/postgres
    ports:
      - '5432:5432'
